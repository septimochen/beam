name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: Status check
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    env:
      CLANG_FORMAT: clang-format-23
      CLANG_TIDY: clang-tidy-23
      CMAKE_ARGS: -DBEAM_ENABLE_DESKTOP=ON
    steps:
      - uses: actions/checkout@v4
      - name: Install check prerequisites
        run: |
          curl --compressed -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm.asc
          sudo install -m 644 /tmp/llvm.asc /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main' | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update
          sudo apt-get install -y libssl-dev nlohmann-json3-dev perl libavahi-compat-libdnssd-dev avahi-daemon qt6-base-dev qt6-qpa-plugins clang-format-23 clang-tidy-23
          clang-format-23 --version
          clang-tidy-23 --version
      - name: Check formatting
        run: make format-check
      - name: Build pinned MsQuic
        run: make deps
      - name: Lint and static analysis
        run: make lint BUILD_TYPE=Release
      - name: Build and test
        run: make test BUILD_TYPE=Release
      - name: Test LAN discovery with Avahi
        run: |
          sudo systemctl start avahi-daemon
          make discovery-test BUILD_TYPE=Release
          cmake --build build --target desktop-live-test --config Release

  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BEAM_DESKTOP: ${{ matrix.os == 'windows-latest' && 'OFF' || 'ON' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          curl --compressed -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm.asc
          sudo install -m 644 /tmp/llvm.asc /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main' | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update
          sudo apt-get install -y libssl-dev nlohmann-json3-dev perl libavahi-compat-libdnssd-dev avahi-daemon qt6-base-dev qt6-qpa-plugins clang-format-23
          clang-format-23 --version
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install openssl@3 nlohmann-json ninja
      - name: Build pinned MsQuic
        if: runner.os != 'Windows'
        run: cmake -DBEAM_DEPS_DIR="$PWD/build/deps" -P cmake/BootstrapMsQuic.cmake
      - name: Check formatting
        if: runner.os == 'Linux'
        run: make format-check CLANG_FORMAT=clang-format-23
      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBEAM_ENABLE_DESKTOP=${{ env.BEAM_DESKTOP }}
      - name: Check Swift formatting
        if: runner.os == 'macOS'
        run: xcrun swift-format lint --strict --recursive src/desktop/macos tests/desktop/macos
      - name: Configure native macOS desktop
        if: runner.os == 'macOS'
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBEAM_ENABLE_DESKTOP=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Test LAN discovery
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo systemctl start avahi-daemon; fi
          make discovery-test BUILD_TYPE=Release
          cmake --build build --target desktop-live-test --config Release
